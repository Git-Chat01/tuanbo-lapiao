# CI：push master → 跑两套安全测试；只有 site/ 真的变了才发布到 gh-pages
# 也可以手动触发（workflow_dispatch）强制重发前端，见下方 on: 处的说明
# 沿用 expense-tracker 的模式（peaceiris 直接推分支，绕过官方部署 API）
# ⚠️ 关键差异：publish_dir 是 ./site 而不是 . —— 保证 worker/ 与 .dev.vars 绝不进公开的 gh-pages 分支
#
# 为什么拆成 test / deploy 两个 job（2026-09-15）：
# worker/ 是独立部署的（手动 npx wrangler deploy），与前端无关。此前任何 push 都会
# 重发一次前端——site/ 没变时是纯空操作，却让"只改了 worker"看起来也动了线上前端。
# 这里刻意不用 paths 过滤：那会让 worker 改动连测试都不跑，而 worker-safety.mjs
# 恰恰是守 worker 的。所以测试照跑，只把"发布"这一步按 site/ 变更与否关掉。
name: Test and deploy site

on:
  push:
    branches: [master]

  # 手动兜底（2026-09-15）：site/ 没变化时 push 会跳过发布，若哪天需要强制重发前端，
  # 走 Actions 页面 → Test and deploy site → Run workflow → 选 master。
  # 手动触发一律发布——否则 site/ 自上次推送以来没变的话，手动重发会被同一道守卫挡回去。
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: tuanbo-lapiao-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Verify coaching and frontend safety
        run: |
          node tests/worker-safety.mjs
          node tests/frontend-safety.mjs

  deploy:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # 需要完整历史，才能比对 push 前后的 site/ 差异
          fetch-depth: 0

      - name: Detect site/ changes
        id: site
        env:
          # 用 env 传入，避免把事件字段拼进 shell 脚本
          BEFORE_SHA: ${{ github.event.before }}
          HEAD_SHA: ${{ github.sha }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          # 手动触发没有 before 字段，语义就是"我现在就要发前端"，直接放行。
          # 这条必须显式写：不写的话靠下面 BEFORE_SHA 为空也能跑通，但那是巧合不是设计，
          # 将来谁给工作流加了别的非 push 触发就会踩坑。
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "手动触发，跳过 site/ 变更检测，强制发布"
            exit 0
          fi
          # 首次推送或强推时 before 是全 0，历史不可比，保守起见照常发布
          if [ -z "$BEFORE_SHA" ] || [ "$BEFORE_SHA" = "0000000000000000000000000000000000000000" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # git diff 出错（如对象不可达）同样走 else 分支默认发布，不会静默跳过
          if git diff --quiet "$BEFORE_SHA" "$HEAD_SHA" -- site/; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Deploy
        if: steps.site.outputs.changed == 'true'
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./site
          publish_branch: gh-pages
          keep_files: false
