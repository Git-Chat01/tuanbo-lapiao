<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <!-- 移动端优先：完全复制 expense-tracker 的 viewport 策略 -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#D92662">
  <!-- CSP：全站本地资源 + 仅允许访问教练 Worker（部署时补充生产域名） -->
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'self' https://lapiao.aivar.cc http://127.0.0.1:* http://localhost:*; object-src 'none'; form-action 'self'; base-uri 'self'">
  <title>拉票话术教练</title>
  <link rel="stylesheet" href="css/common.css">
  <link rel="stylesheet" href="css/form.css">
  <link rel="stylesheet" href="css/report.css">
</head>
<body>
  <div class="app-container">
    <header class="app-header">
      <h1 class="app-title">拉票话术教练</h1>
      <button type="button" id="btn-access-code" class="btn-text">入口码</button>
    </header>

    <!-- 视图 1：输入表单（v2 极简：只点、只写、只交） -->
    <main id="view-form" class="main-view main-view--active">
      <p class="form-intro">
        点、写、交，就这三件事。
      </p>

      <section class="card">
        <h2 class="card-title">现在票数什么情况 <span class="required-tag">点一个</span></h2>
        <div class="chip-group chip-group--big" data-group="voteGap" data-multi="false">
          <button type="button" class="chip" data-value="far" aria-pressed="false">差一大截</button>
          <button type="button" class="chip" data-value="close" aria-pressed="false">快够了</button>
          <button type="button" class="chip" data-value="secured" aria-pressed="false">在保位</button>
        </div>
      </section>

      <section class="card">
        <h2 class="card-title">你的话术</h2>
        <textarea id="input-script" class="script-input" maxlength="500" rows="7"
                  placeholder="把你现场会说的话原样写下来，不用写对——写出来，教练才能帮你。"></textarea>
        <div class="char-count" id="script-count">0/500</div>
      </section>

      <!-- 提交按钮放流末尾而非 fixed 底栏：iOS 键盘弹出时 fixed 底栏会上浮压住内容 -->
      <button type="button" id="btn-submit" class="btn-primary btn-block" disabled>拿去给教练批</button>
    </main>

    <!-- 视图 2：批改报告 -->
    <main id="view-report" class="main-view">
      <div id="report-loading" class="report-loading" hidden>
        <div class="spinner"></div>
        <p>教练正在看你这段话，别急……</p>
        <p class="loading-sub">批改一般要十几秒，好话术值得等</p>
      </div>
      <div id="report-error" class="report-error" hidden></div>
      <!-- 红线横幅：命中不能播的词时显示（report.js 动态填充，红底白字） -->
      <div id="redline-banner" class="redline-banner" hidden></div>
      <div id="report-content" hidden></div>
      <div class="report-actions">
        <button type="button" id="btn-back-edit" class="btn-outline">改一改再批</button>
        <button type="button" id="btn-retry" class="btn-outline" hidden>重新批一次</button>
      </div>
    </main>

    <!-- 视图 3：过关页（verdict=passed 时进入） -->
    <main id="view-passed" class="main-view">
      <div class="passed-hero">
        <div class="passed-hero__icon">🎉</div>
        <h2 class="passed-hero__title">过关了！</h2>
        <p class="passed-hero__sub">这一稿方向对了，拿去用</p>
      </div>

      <section class="card passed-script-card">
        <h2 class="card-title">你的定稿</h2>
        <div id="passed-script" class="passed-script"></div>
        <button type="button" id="btn-copy" class="btn-primary btn-block">复制定稿</button>
      </section>

      <section class="card">
        <h2 class="card-title">这一稿你学会了什么</h2>
        <div id="passed-learn" class="report-section__body"></div>
      </section>

      <section class="card passed-note">
        <p>稿子过关 ≠ 综合过关。表现力、情绪、语感，去线下直播间里练。</p>
      </section>

      <button type="button" id="btn-new-round" class="btn-outline btn-block">再练一段新的</button>
    </main>
  </div>

  <!-- 入口码 modal：首次进入 + 401 时弹出 -->
  <div id="access-modal" class="modal-overlay" hidden>
    <div class="modal" role="dialog" aria-modal="true" aria-labelledby="access-modal-title">
      <h2 id="access-modal-title" class="modal-title">输入入口码</h2>
      <p class="modal-desc">找教练要入口码，输入后就可以用了</p>
      <input type="password" id="input-access-code" class="text-input" autocomplete="off"
             placeholder="入口码">
      <p id="access-error" class="modal-error" hidden>入口码不对，重新输入</p>
      <div class="modal-actions">
        <button type="button" id="btn-access-confirm" class="btn-primary">确定</button>
      </div>
    </div>
  </div>

  <!-- 全局 toast -->
  <div id="toast-container" class="toast-container" aria-live="polite"></div>

  <!-- 传统 script 按依赖顺序加载（沿用 expense-tracker 模式，非 ES Module） -->
  <script src="js/config.js"></script>
  <script src="js/app.js"></script>
  <script src="js/form.js"></script>
  <script src="js/api.js"></script>
  <script src="js/report.js"></script>
</body>
</html>
